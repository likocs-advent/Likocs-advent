<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🎄 Karácsonyi térkép</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin:0; height:100%; overflow:hidden; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #map { position:absolute; inset:0; }
  #info {
    position:absolute; z-index:1000; left:8px; right:8px;
    top:calc(env(safe-area-inset-top,0px) + 40px);
    background:linear-gradient(180deg,#fffaf0,#fff1dc); border:3px solid #b3202a; outline:2px solid #d4af37; outline-offset:-7px;
    border-radius:16px; padding:12px 14px;
    box-shadow:0 4px 14px rgba(0,0,0,.4); display:flex; align-items:center; gap:12px;
    max-width:520px; margin:0 auto;
  }
  #num { flex:none; width:48px; height:48px; border-radius:50%; background:#1f8a3c; color:#fff; border:3px solid #d4af37;
    font-weight:700; font-size:20px; display:flex; align-items:center; justify-content:center; }
  #txt { flex:1; min-width:0; }
  #date, #addr { color:#7a1017; font-weight:700; font-size:15px; line-height:1.25; overflow-wrap:anywhere; }
  #date { font-size:15px; line-height:1.25; color:#b3202a; }
  #fb { margin-top:8px; font-size:12px; color:#333; line-height:1.35; }
  #fb button { margin:6px 6px 0 0; border:2px solid #d4af37; background:#1f8a3c; color:#fff; font-size:13px; font-weight:600; padding:8px 10px; border-radius:8px; touch-action:manipulation; }
  #meta { font-size:12px; color:#555; margin-top:2px; }
  #go { flex:none; border:2px solid #d4af37; background:#b3202a; color:#fff; font-size:14px; font-weight:600;
    padding:12px 14px; border-radius:10px; touch-action:manipulation; }
  #go:disabled { background:#b99; }
  .pt { background:#1f8a3c; color:#fff; border:2px solid #d4af37; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;
    box-shadow:0 1px 4px rgba(0,0,0,.5); }
  .star { position:relative; width:56px; height:56px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  .star svg { width:100%; height:100%; }
  .star span { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#7a1017; font-weight:800; font-size:15px; padding-top:3px; }
  .me { width:16px; height:16px; background:#d4af37; border:3px solid #fff; border-radius:50%;
    box-shadow:0 0 0 3px rgba(179,32,42,.6); }
  /* --- Karácsonyi réteg --- */
  .xmas { position:absolute; z-index:900; pointer-events:none; }
  #frame { inset:0; border:7px solid; border-image:repeating-linear-gradient(45deg,#b3202a 0 12px,#fff 12px 24px) 7;
    box-shadow:inset 0 0 22px rgba(179,32,42,.45); }
  #lights { left:0; right:0; top:env(safe-area-inset-top,0px); height:34px; display:flex; justify-content:space-around; padding:0 4px; z-index:1100; }
  #lights::before { content:""; position:absolute; left:0; right:0; top:3px; height:2px; background:#1c3d1c; }
  .bulb { position:relative; top:5px; width:11px; height:17px; border-radius:50% 50% 55% 55%; animation:tw 1.6s infinite ease-in-out; }
  .bulb::before { content:""; position:absolute; left:2px; top:-5px; width:7px; height:6px; background:#333; border-radius:2px; }
  @keyframes tw { 0%,100%{opacity:1; filter:brightness(1.3)} 50%{opacity:.35; filter:brightness(.7)} }
  #holly { left:6px; bottom:calc(env(safe-area-inset-bottom,0px) + 6px); width:130px; z-index:1000; filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  #holly2 { right:6px; top:calc(env(safe-area-inset-top,0px) + 118px); width:90px; z-index:1000; transform:scaleX(-1); filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  #deco { right:64px; bottom:calc(env(safe-area-inset-bottom,0px) + 8px); font-size:30px; z-index:1000; letter-spacing:4px; }
  #snow { inset:0; width:100%; height:100%; z-index:1050; }
</style>
</head>
<body>
<div id="map"></div>
<div id="frame" class="xmas"></div>
<div id="lights" class="xmas"></div>
<div id="holly" class="xmas"><svg viewBox="0 0 130 90"><g><path d="M10 80C25 40 60 30 70 55C50 55 30 62 10 80Z" fill="#1f8a3c" stroke="#0f5a24" stroke-width="2"/><path d="M45 85C55 50 90 35 118 60C95 58 70 66 45 85Z" fill="#2aa24b" stroke="#0f5a24" stroke-width="2"/><path d="M20 60C30 30 55 15 80 28C60 30 40 40 20 60Z" fill="#26953f" stroke="#0f5a24" stroke-width="2"/><circle cx="62" cy="58" r="8" fill="#c8102e"/><circle cx="76" cy="64" r="8" fill="#e0213d"/><circle cx="68" cy="72" r="8" fill="#c8102e"/><circle cx="59" cy="55" r="2.5" fill="#fff" opacity=".7"/></g></svg></div>
<div id="holly2" class="xmas"><svg viewBox="0 0 130 90"><g><path d="M10 80C25 40 60 30 70 55C50 55 30 62 10 80Z" fill="#1f8a3c" stroke="#0f5a24" stroke-width="2"/><path d="M45 85C55 50 90 35 118 60C95 58 70 66 45 85Z" fill="#2aa24b" stroke="#0f5a24" stroke-width="2"/><path d="M20 60C30 30 55 15 80 28C60 30 40 40 20 60Z" fill="#26953f" stroke="#0f5a24" stroke-width="2"/><circle cx="62" cy="58" r="8" fill="#c8102e"/><circle cx="76" cy="64" r="8" fill="#e0213d"/><circle cx="68" cy="72" r="8" fill="#c8102e"/><circle cx="59" cy="55" r="2.5" fill="#fff" opacity=".7"/></g></svg></div>
<div id="deco" class="xmas">🎄🎁⛄</div>
<canvas id="snow" class="xmas"></canvas>
<div id="info">
  <div id="num">–</div>
  <div id="txt"><div id="date"></div><div id="addr">Nincs megjeleníthető pont</div><div id="meta"></div>
    <div id="fb" hidden></div></div>
  <button id="go" disabled>Vezess oda</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ===== ADATOK: cseréld a saját geojson-odra =====
// "dátum": helyi idő, formátum: YYYY-MM-DDTHH:MM:SS
const GEOJSON = {
  "type": "FeatureCollection",
  "features": [
    { "type":"Feature", "geometry":{"type":"Point","coordinates":[17.676,47.6735]}, "properties":{"szám":1,"cím":"Győr-Likócs, Pesti út 12.","dátum":"2026-11-01T08:00:00"} },
    { "type":"Feature", "geometry":{"type":"Point","coordinates":[17.68,47.6742]}, "properties":{"szám":2,"cím":"Győr-Likócs, Pesti út 38.","dátum":"2026-11-02T09:30:00"} },
    { "type":"Feature", "geometry":{"type":"Point","coordinates":[17.685,47.675]}, "properties":{"szám":3,"cím":"Győr-Likócs, Pesti út 71.","dátum":"2026-11-02T16:45:00"} },
    { "type":"Feature", "geometry":{"type":"Point","coordinates":[17.679,47.676]}, "properties":{"szám":4,"cím":"Győr-Likócs, Esztergető utca 3.","dátum":"2026-11-03T10:00:00"} },
    { "type":"Feature", "geometry":{"type":"Point","coordinates":[17.6805,47.6772]}, "properties":{"szám":5,"cím":"Győr-Likócs, Esztergető utca 12.","dátum":"2026-11-04T08:20:00"} },
    { "type":"Feature", "geometry":{"type":"Point","coordinates":[17.682,47.6784]}, "properties":{"szám":6,"cím":"Győr-Likócs, Esztergető utca 25.","dátum":"2026-11-04T17:10:00"} },
    { "type":"Feature", "geometry":{"type":"Point","coordinates":[17.684,47.673]}, "properties":{"szám":7,"cím":"Győr-Likócs, Római utca 5.","dátum":"2026-11-05T11:00:00"} },
    { "type":"Feature", "geometry":{"type":"Point","coordinates":[17.6865,47.6738]}, "properties":{"szám":8,"cím":"Győr-Likócs, Római utca 21.","dátum":"2026-11-05T18:30:00"} },
    { "type":"Feature", "geometry":{"type":"Point","coordinates":[17.683,47.6715]}, "properties":{"szám":9,"cím":"Győr-Likócs, Kövecses utca 4.","dátum":"2026-11-06T09:00:00"} },
    { "type":"Feature", "geometry":{"type":"Point","coordinates":[17.6855,47.6708]}, "properties":{"szám":10,"cím":"Győr-Likócs, Kövecses utca 16.","dátum":"2026-11-06T15:15:00"} },
    { "type":"Feature", "geometry":{"type":"Point","coordinates":[17.6885,47.676]}, "properties":{"szám":11,"cím":"Győr-Likócs, Szittya utca 2.","dátum":"2026-11-07T07:30:00"} },
    { "type":"Feature", "geometry":{"type":"Point","coordinates":[17.69,47.6772]}, "properties":{"szám":12,"cím":"Győr-Likócs, Szittya utca 14.","dátum":"2026-11-07T21:00:00"} },
    { "type":"Feature", "geometry":{"type":"Point","coordinates":[17.688,47.6725]}, "properties":{"szám":13,"cím":"Győr-Likócs, Laktanya utca 7.","dátum":"2026-11-08T09:00:00"} },
    { "type":"Feature", "geometry":{"type":"Point","coordinates":[17.691,47.6735]}, "properties":{"szám":14,"cím":"Győr-Likócs, Laktanya utca 19.","dátum":"2026-11-09T10:30:00"} },
    { "type":"Feature", "geometry":{"type":"Point","coordinates":[17.687,47.6785]}, "properties":{"szám":15,"cím":"Győr-Likócs, Kör tér 1.","dátum":"2026-11-10T08:00:00"} },
    { "type":"Feature", "geometry":{"type":"Point","coordinates":[17.689,47.6795]}, "properties":{"szám":16,"cím":"Győr-Likócs, Kör tér 6.","dátum":"2026-11-11T12:00:00"} },
    { "type":"Feature", "geometry":{"type":"Point","coordinates":[17.6925,47.6755]}, "properties":{"szám":17,"cím":"Győr-Likócs, Pesti út 104.","dátum":"2026-11-12T14:00:00"} }
  ]
};
// Külső fájlból is betöltheted: állítsd be az URL-t (különben a fenti adat lesz használva)
const GEOJSON_URL = "";
// ================================================

const map = L.map('map', { zoomControl:false }).setView([47.6745, 17.6830], 15);
L.control.zoom({ position:'bottomright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19, attribution:'© OpenStreetMap'
}).addTo(map);

const $ = id => document.getElementById(id);
let data = GEOJSON, markers = L.layerGroup().addTo(map), routeLine = null, latest = null, me = null, meMarker = null, first = true;

// Idő: mindig Győr (Europe/Budapest) helyi ideje szerint, "YYYY-MM-DDTHH:MM:SS" szövegként összehasonlítva
const TZ = 'Europe/Budapest';
const HU_MONTHS = ['Január','Február','Március','Április','Május','Június','Július','Augusztus','Szeptember','Október','November','December'];
function budapestWall(d){
  const o = {}; new Intl.DateTimeFormat('en-GB', { timeZone:TZ, hourCycle:'h23', year:'numeric', month:'2-digit',
    day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' }).formatToParts(d).forEach(p => o[p.type] = p.value);
  return `${o.year}-${o.month}-${o.day}T${o.hour}:${o.minute}:${o.second}`;
}
// A geojson "dátum" értéke helyi (győri) idő; ha időzóna-jelölést (Z / +01:00) tartalmaz, átváltjuk győri időre
function dkey(s){
  s = String(s).trim().replace(' ', 'T');
  if (/(Z|[+-]\d\d:?\d\d)$/.test(s)) return budapestWall(new Date(s));
  if (s.length === 10) s += 'T00:00:00';
  if (s.length === 16) s += ':00';
  return s.slice(0, 19);
}
// ?szam=12 → a 12-es pont ideje számít "mostnak": ő a csillag, és minden korábbi pont látszik
const SZAM = (() => { const v = new URLSearchParams(location.search).get('szam'); return v !== null && v.trim() !== '' && !isNaN(v) ? parseInt(v, 10) : null; })();

function render(){
  markers.clearLayers();
  const pts = data.features.filter(f => f.geometry && f.geometry.type === 'Point');
  const forced = SZAM === null ? null : pts.find(f => f.properties['szám'] === SZAM) || null;
  const now = forced ? dkey(forced.properties['dátum']) : budapestWall(new Date());
  const vis = pts
    .filter(f => dkey(f.properties['dátum']) <= now)
    .sort((a,b) => dkey(a.properties['dátum']).localeCompare(dkey(b.properties['dátum'])));
  const newest = forced || (vis.length ? vis[vis.length-1] : null);

  vis.forEach(f => {
    const [lng, lat] = f.geometry.coordinates, p = f.properties;
    const isLatest = f === newest;
    const icon = isLatest
      ? L.divIcon({ className:'', iconSize:[56,56], iconAnchor:[28,28],
          html:`<div class="star"><svg viewBox="0 0 24 24"><path fill="#d4af37" stroke="#b3202a" stroke-width="1" d="M12 1.5l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 17.6 5.6 21.1 7 14l-5.3-5 7.2-.9z"/></svg><span>${p['szám']}</span></div>` })
      : L.divIcon({ className:'', iconSize:[30,30], iconAnchor:[15,15],
          html:`<div class="pt" style="width:30px;height:30px">${p['szám']}</div>` });
    L.marker([lat, lng], { icon, zIndexOffset: isLatest ? 1000 : 0 })
      .bindPopup(`<b>${p['szám']}</b><br>${p['cím']}`).addTo(markers);
  });

  const changed = !latest || !newest || latest !== newest;
  latest = newest;
  if (newest) {
    const p = newest.properties;
    $('num').textContent = p['szám'];
    $('addr').textContent = p['cím'];
    const k = dkey(p['dátum']);
    $('date').textContent = HU_MONTHS[parseInt(k.slice(5,7),10)-1] + ' ' + parseInt(k.slice(8,10),10) + '.';
    if (changed) { $('meta').textContent = ''; if (routeLine) { map.removeLayer(routeLine); routeLine = null; } }
    $('go').disabled = false;
    if (first) {
      first = false;
      const [lng, lat] = newest.geometry.coordinates;
      map.setView([lat, lng], 15);
    }
  } else {
    $('num').textContent = '–'; $('addr').textContent = 'Nincs megjeleníthető pont';
    $('date').textContent = ''; $('meta').textContent = ''; $('go').disabled = true;
  }
}

function startLocation(){
  if (IN_APP) setTimeout(() => { if (!me) showFallback(); }, 10000);
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition(pos => {
    me = [pos.coords.latitude, pos.coords.longitude];
    $('fb').hidden = true;
    if (!meMarker) meMarker = L.marker(me, { icon:L.divIcon({className:'', html:'<div class="me"></div>', iconSize:[16,16], iconAnchor:[8,8]}), interactive:false, zIndexOffset:-100 }).addTo(map);
    else meMarker.setLatLng(me);
  }, () => { if (IN_APP && !me) showFallback(); }, { enableHighAccuracy:true, maximumAge:5000 });
}

function getPosition(){
  return new Promise((res, rej) => {
    if (me) return res(me);
    navigator.geolocation.getCurrentPosition(
      p => { me = [p.coords.latitude, p.coords.longitude]; res(me); },
      rej, { enableHighAccuracy:true, timeout:10000 });
  });
}

// Ha a helyzet nem kérhető le (pl. Messenger/Facebook beépített böngészője), felkínáljuk a külső böngészőt
// Beépített (app-)böngésző felismerése: Facebook, Messenger, Instagram
const IN_APP = /FBAN|FBAV|FB_IAB|FBIOS|FB4A|Messenger|Instagram/i.test(navigator.userAgent);

function showFallback(){
  const fb = $('fb'), url = location.href, ua = navigator.userAgent;
  const android = /Android/i.test(ua), ios = /iPhone|iPad|iPod/i.test(ua);
  if (!IN_APP) {
    // Normál böngésző: nincs külső böngészős javaslat, csak a helyzet bekapcsolására kérünk
    fb.innerHTML = '<b>Nem sikerült lekérni a helyzetedet.</b> Kapcsold be a GPS-t (helymeghatározást), engedélyezd a helyhozzáférést ennél az oldalnál, majd próbáld újra.';
    fb.hidden = false;
    return;
  }
  fb.innerHTML = '<b>Nem sikerült lekérni a helyzetedet.</b> Ez gyakori beépített böngészőben (pl. Facebook). Próbáld meg külső böngészőben:'
    + '<br><button id="fbOpen">Megnyitás böngészőben</button>'
    + (ios ? '<br>Vagy: ⋯ menü → „Megnyitás Safariban”.' : '');
  fb.hidden = false;
  $('fbOpen').onclick = () => {
    if (android) {
      const u = new URL(url), scheme = u.protocol.replace(':','');
      location.href = `intent://${u.host}${u.pathname}${u.search}#Intent;scheme=${scheme};action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;S.browser_fallback_url=${encodeURIComponent(url)};end`;
    } else {
      window.open(url, '_blank');
    }
  };
}

$('go').addEventListener('click', async () => {
  if (!latest) return;
  const btn = $('go'); btn.disabled = true; btn.textContent = '…';
  try {
    let geoFail = false;
    let tm;
    const from = await Promise.race([
      getPosition(),
      new Promise((_, rej) => { tm = setTimeout(() => rej(new Error('timeout')), 10000); })
    ]).catch(e => { geoFail = true; throw e; }).finally(() => clearTimeout(tm));
    $('fb').hidden = true;
    const [dLng, dLat] = latest.geometry.coordinates;
    const url = `https://routing.openstreetmap.de/routed-foot/route/v1/foot/${from[1]},${from[0]};${dLng},${dLat}?overview=full&geometries=geojson`;
    const r = await (await fetch(url)).json();
    if (!r.routes || !r.routes.length) throw new Error('no route');
    const route = r.routes[0];
    if (routeLine) map.removeLayer(routeLine);
    routeLine = L.geoJSON(route.geometry, { style:{ color:'#b3202a', weight:6, opacity:.9, dashArray:'2 10', lineCap:'round' } }).addTo(map);
    map.fitBounds(routeLine.getBounds(), { paddingTopLeft:[20,110], paddingBottomRight:[20,20] });
    const km = route.distance/1000, min = Math.round(route.duration/60);
    $('meta').textContent = `Gyalog: ${km < 1 ? Math.round(route.distance)+' m' : km.toFixed(1)+' km'} · ~${min} perc`;
  } catch (e) {
    if (geoFail) { $('meta').textContent = ''; showFallback(); }
    else $('meta').textContent = 'Nem sikerült útvonalat tervezni (hálózati hiba vagy nincs útvonal).';
  }
  btn.disabled = false; btn.textContent = 'Vezess oda';
});

// Fényfüzér
(function(){
  const cols=['#e0213d','#ffd23f','#2aa24b','#3fa7ff','#ff8a1f'], box=document.getElementById('lights');
  const n=Math.max(8,Math.floor(innerWidth/30));
  for(let i=0;i<n;i++){const b=document.createElement('span');b.className='bulb';
    const c=cols[i%cols.length];b.style.background=c;b.style.boxShadow='0 0 10px 3px '+c;
    b.style.animationDelay=(i%5)*0.3+'s';box.appendChild(b);}
})();
// Hóesés
(function(){
  const cv=document.getElementById('snow'),ctx=cv.getContext('2d');let W,H,fl=[];
  function size(){const d=devicePixelRatio||1;W=cv.width=innerWidth*d;H=cv.height=innerHeight*d;fl=[];
    for(let i=0;i<70;i++)fl.push({x:Math.random()*W,y:Math.random()*H,r:(1+Math.random()*3)*d,v:(.4+Math.random()*1.1)*d,p:Math.random()*6});}
  size();addEventListener('resize',size);
  (function f(t){ctx.clearRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.9)';
    for(const s of fl){s.y+=s.v;s.x+=Math.sin(t/1200+s.p)*.5;if(s.y>H){s.y=-5;s.x=Math.random()*W;}
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();}
    requestAnimationFrame(f);})(0);
})();

(async function init(){
  if (GEOJSON_URL) {
    try { data = await (await fetch(GEOJSON_URL)).json(); } catch(e) {}
  }
  render();
  startLocation();
  setInterval(render, 30000); // időalapú frissítés
})();
</script>
</body>
</html>
